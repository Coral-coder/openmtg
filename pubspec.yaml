name: openmtg
description: "Every Magic card, the full rules, a theme for every world. Fan-made and free."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  rules:
    path: packages/rules
  collection: ^1.19.1
  crypto: ^3.0.7
  http: ^1.5.0
  shared_preferences: ^2.5.6
  path_provider: ^2.1.6
  flutter_local_notifications: ^22.3.2
  web_socket_channel: ^3.0.3
  nostr: ^2.0.0
  bluetooth_low_energy: ^6.2.1
  permission_handler: ^13.0.2
  share_plus: ^13.3.1
  audioplayers: ^6.8.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/data/
  # Open Font License fonts for the themes (licenses in assets/fonts/).
  fonts:
    - family: Antonio
      fonts:
        - asset: assets/fonts/Antonio.ttf
    - family: Alegreya
      fonts:
        - asset: assets/fonts/Alegreya.ttf
    - family: Bangers
      fonts:
        - asset: assets/fonts/Bangers.ttf
    - family: Philosopher
      fonts:
        - asset: assets/fonts/Philosopher.ttf
        - asset: assets/fonts/Philosopher-Bold.ttf
          weight: 700
